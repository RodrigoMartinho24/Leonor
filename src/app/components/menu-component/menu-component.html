@if (isOpen()) {
  <div class="overlay" (click)="close()">
    <div
      class="menu"
      (click)="$event.stopPropagation()"
      [class]="position()"
      [style.left.px]="left()"
      [style.top.px]="top()"
      [style.--arrow-position]="arrowPosition() + 'px'"
    >
      <ng-content />
    </div>
  </div>
}
