<input type="text" placeholder="Título" [value]="title()" (input)="title.set($event.target.value)" />

<div class="flex gap-4">
  <button create [disabled]="!title()" (click)="create()">
    <svg lucideCheck size="18"></svg>
    Criar
  </button>

  <button (click)="close()" danger>
    <svg lucideX size="18"></svg>
    Cancelar
  </button>
</div>
